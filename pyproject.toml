[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insar-data-adapter"
version = "0.20.0"
description = "Validated, bounded-memory adapters for InSAR time-series products"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["h5py>=3.8", "numpy>=1.24", "pyproj>=3.4", "rasterio>=1.3"]

[project.scripts]
insar-adapter = "insar_data_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/insar-data-adapter/config/canonical" = [
  "config/canonical/gamma_to_canonical_h5.cfg",
  "config/canonical/inspect_h5.cfg",
  "config/canonical/licsbas_to_canonical_h5.cfg",
  "config/canonical/mintpy_to_canonical_h5.cfg",
]
"share/insar-data-adapter/config/data2defsour" = [
  "config/data2defsour/gamma_to_defsour.cfg",
  "config/data2defsour/licsbas_to_defsour.cfg",
  "config/data2defsour/mintpy_to_defsour.cfg",
]

[tool.unittest]
start-directory = "tests"
