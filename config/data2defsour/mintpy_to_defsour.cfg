# MintPy -> Defsour transactional snapshot / MintPy -> Defsour 事务快照
# Command / 命令：
#   insar-adapter export-mintpy-defsour --config config/data2defsour/mintpy_to_defsour.cfg
# PATH CONTRACT / 路径契约
# INPUT / 输入：显式只读 timeseries、geometry 与 mask，不搜索同目录文件。
# OUTPUT / 输出：整个 output_dir 原子替换；失败保留旧快照。

output_dir = /path/to/project/S1/ASCENDING_128/MintPy/EXPORT/DEFSOUR/MINTPY
dates = all
prefix = mintpy_
extension = .txt
timeseries_file = /path/to/project/S1/ASCENDING_128/MintPy/timeseries.h5
geometry_file = /path/to/project/S1/ASCENDING_128/MintPy/geometryGeo.h5
mask_file = /path/to/project/S1/ASCENDING_128/MintPy/maskTempCoh.h5
timeseries_dataset = timeseries
date_dataset = date
height_dataset = height
mask_dataset = mask

source_crs = EPSG:4326
output_crs = EPSG:32647
deformation_scale = 1000
output_unit = mm
deformation_quantity = cumulative_displacement
height_unit = m
los_positive = toward_satellite
nodata_policy = finite values and explicit nonzero mask; zero is valid
temporal_reference = preserve
spatial_reference = preserve
source_provenance = MintPy timeseries with explicit geometry and mask

downsample_mode = factor
factor = 1
aggregation = mean
chunk_rows = 128
write_tif = true
write_native_tif = false
write_velocity_tif = false
write_dem_tif = false
native_only = false
overwrite = true

# Optional native velocity / 可选原分辨率速度图：
# velocity_file = /path/to/velocity.h5
# velocity_dataset = velocity
# velocity_source_unit = m/year
# write_velocity_tif = true
