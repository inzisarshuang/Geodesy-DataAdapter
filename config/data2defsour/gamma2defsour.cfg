# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：GAMMA → Defsour
# RUN / 运行：在仓库根目录使用 envInSAR。
#   insar-adapter export-gamma-defsour --config config/data2defsour/gamma2defsour.cfg
# INPUTS / 输入：GAMMA_mb 位移表、日期、同网格 DEM/参数和掩膜。
# OUTPUTS / 输出：output_dir 中的时期文本、可选栅格和 defsour_manifest.json。
# RERUN / 重跑：overwrite = true 时，全部选中时期成功后替换旧快照；失败保留旧目录。
# DOWNSTREAM / 下游：Defsour 反演可读取清单所列产品。

output_dir = /path/to/project/S1/ASCENDING_128/GAMMA_mb/EXPORT/DEFSOUR/GAMMA
# all selects every date; otherwise supply a comma-separated list of YYYYMMDD dates.
# 可选 all（全部），或以英文逗号分隔的 YYYYMMDD 日期。
dates = all
prefix = gamma_
extension = .txt

# Use the geographic lon/lat grid products from the same GAMMA_mb run.
# 使用同一次 GAMMA_mb 运行生成的规则经纬度产品。
tab_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/TIMESERIES/GAMMA_MB/DISPLACEMENT_GEO/displacement_geo_tab
dates_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/TIMESERIES/GAMMA_MB/images
parameter_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/GEOCODING/demcrop.dem_par
height_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/GEOCODING/demcrop.dem
mask_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/TIMESERIES/GAMMA_MB/final_mask.geo

# Radar-coordinate inputs additionally require both coordinate rasters and their
# binary metadata. / 雷达坐标输入需同时启用以下六项。
# longitude_file = /path/to/longitude.bin
# latitude_file = /path/to/latitude.bin
# Optional coordinate binaries follow the same dtype and byte-order choices.
# 经纬度文件的类型和字节序选项与下方其他二进制文件相同。
# longitude_dtype = float32
# longitude_byte_order = big
# latitude_dtype = float32
# latitude_byte_order = big

# Use a fixed-width real NumPy dtype matching each file.
# 常用可选 float16/float32/float64、int8/int16/int32/int64、
# uint8/uint16/uint32/uint64，也接受等价 NumPy 写法（如 f4 和 u1）。
deformation_dtype = float32
# Accepted: big (big-endian), little (little-endian), native (host-endian).
# 可选 big（大端）、little（小端）、native（运行机器字节序）；按对应文件实际格式填写。
deformation_byte_order = big
height_dtype = float32
# Accepted: big (big-endian), little (little-endian), native (host-endian).
# 可选 big（大端）、little（小端）、native（运行机器字节序）；按对应文件实际格式填写。
height_byte_order = big
mask_dtype = float32
# Accepted: big (big-endian), little (little-endian), native (host-endian).
# 可选 big（大端）、little（小端）、native（运行机器字节序）；按对应文件实际格式填写。
mask_byte_order = big
# deformation_nodata = -9999
# height_nodata = -9999

source_crs = EPSG:4326
output_crs = EPSG:32647
# Accepted: pixel_center.
# 此入口仅接受 pixel_center（坐标表示像元中心）。
grid_registration = pixel_center
deformation_scale = 1000
# Accepted: m, cm, mm or their meter/metre spelling variants and plurals.
# 可选 m、cm、mm，也接受带 meter/metre 后缀的全称及复数，例如 metre、centimeters、millimetres。
source_unit = meter
# Derived from the source unit and deformation_scale. Use m/cm/mm for those conversions.
# 按源单位和倍率填写 m、cm 或 mm；其他倍率使用 scaled_from_<源单位>_by_<倍率>。
output_unit = mm
# Accepted metadata values: cumulative_displacement or velocity. Match the source quantity.
# 可选 cumulative_displacement（累计位移）、velocity（速度）；代码按此记录物理量。
deformation_quantity = cumulative_displacement
height_unit = m
# LOS sign is recorded as metadata. Use the source convention, e.g. toward_satellite or away_from_satellite.
# LOS 正方向写入元数据。按来源填写，例如 toward_satellite（朝卫星）或 away_from_satellite（远离卫星）。
los_positive = toward_satellite
nodata_policy = finite deformation and height plus explicit positive mask; zero is valid
# Accepted: preserve, first, or a selected YYYYMMDD date.
# 可选 preserve（保留源值）、first（参考首个选中时期）或选中时期中的 YYYYMMDD。
temporal_reference = first
spatial_reference = upstream GAMMA reference recorded by the Analysis manifest
source_provenance = GAMMA mb displacement stack and timeseries_manifest.json

# Accepted: native builds an independent spatial sample; aligned requires alignment_template.
# 可选 native（本轨独立采样）、aligned（按指定模板对齐，须设置 alignment_template）。
mode = native
# To create a template, point to alignment_template.npz inside output_dir.
# 首次生成对齐模板时，路径应为 output_dir 下的 alignment_template.npz。
# alignment_template = /path/to/output/alignment_template.npz
# true writes invalid sample points as NaN, false filters them out. Default false.
# true 保留无效采样点并写 NaN，false 过滤无效点；默认 false。
# Accepted: true/yes/1/on or false/no/0/off (case-insensitive).
# 可选 true/yes/1/on 或 false/no/0/off，不区分大小写。
export_invalid_points = false
# Accepted: factor, target_points, target_pixel_size. Set the corresponding key below.
# 可选 factor（整数倍数）、target_points（目标点数）、target_pixel_size（目标像元尺寸）。
# target_pixel_size uses the source grid coordinate unit (degrees for EPSG:4326).
# target_pixel_size 使用源栅格单位（EPSG:4326 为度）；提供逐像元经纬度时用输出 CRS 的单位。
downsample_mode = factor
factor = 1
# target_points = 100000
# target_pixel_size = 0.001
# Accepted: mean (default) or median, over valid samples in each window.
# 可选 mean（有效样本均值，默认）或 median（有效样本中位数）。
aggregation = mean
chunk_rows = 128
# Optional downsampled/geocoded GeoTIFF output; default false.
# 是否同时写降采样后的 GeoTIFF，默认 false。
# Accepted: true/yes/1/on or false/no/0/off (case-insensitive).
# 可选 true/yes/1/on 或 false/no/0/off，不区分大小写。
write_tif = true
# true replaces a completed export after the new export succeeds; false retains it and reports an error. Default true.
# true 在新结果成功后替换旧导出目录，false 保留已有目录并报错；默认 true。
# Accepted: true/yes/1/on or false/no/0/off (case-insensitive).
# 可选 true/yes/1/on 或 false/no/0/off，不区分大小写。
overwrite = true

# Optional Analysis contract validation / 可选 Analysis manifest 一致性检查：
# source_manifest = /path/to/project/S1/ASCENDING_128/GAMMA_mb/TIMESERIES/GAMMA_MB/timeseries_manifest.json
# source_width = 2000
# source_lines = 1500
