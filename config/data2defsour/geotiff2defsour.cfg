# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：Indexed GeoTIFF → Defsour / 带索引 GeoTIFF 导出
# RUN / 运行：在仓库根目录使用 envInSAR。
#   insar-adapter export-geotiff-defsour --config config/data2defsour/geotiff2defsour.cfg
# INPUTS / 输入：一个单波段累积位移时序索引、DEM 和静态掩膜。
# OUTPUTS / 输出：output_dir 中的 epochs/ 文本、可选 geotiff/、README_DEFSOUR.txt 和 defsour_manifest.json。
# RERUN / 重跑：overwrite = true 时，全部选中时期成功后替换旧快照；失败保留旧目录。

# Set one destination for each scalar series, for example LOS or VERTICAL.
# 每个标量时序使用独立输出目录，例如 LOS 或 VERTICAL。
output_dir = /path/to/project/S1/DESCENDING_087/MSBAS/EXPORT/DEFSOUR/LOS
# Use all, or comma-separated YYYYMMDDTHHMMSS values. Export follows index order.
# 使用 all 或逗号分隔的完整时间戳；输出顺序沿用索引文件。
epochs = all
# Filename pattern: <prefix><YYYYMMDDTHHMMSS><extension>.
# 文件名由前缀、完整时间戳和扩展名组成。
prefix = D
extension = .txt

# CFG-relative paths are based on this file. In the index, each non-comment row
# is YYYYMMDDTHHMMSS path/to/epoch.tif and relative TIFF paths use the index directory.
# CFG 中的相对路径以本文件为基准。索引每行是“完整时间戳 TIFF路径”两列，
# 其中 TIFF 相对路径以索引文件所在目录为基准。
index_file = /path/to/series_index.txt
height_file = /path/to/dem.tif
mask_file = /path/to/static_mask.tif
# The finite cells with positive mask values are eligible for export.
# 仅接受 positive，掩膜中有限且大于零的像元参与导出。
mask_mode = positive

# Match source_crs to the deformation TIFF metadata. Choose output_crs for the
# target coordinate system. EPSG:32605 is an example for UTM zone 5N.
# source_crs 要与形变 TIFF 元数据一致；output_crs 按目标坐标系填写。
# EPSG:32605 是 UTM 5N 的示例值。
source_crs = EPSG:4326
output_crs = EPSG:32605

# Scaling is applied exactly once at export. / 倍率只在导出边界应用一次。
# Accepted: m, cm, mm or their meter/metre spelling variants and plurals.
# 可选 m、cm、mm，也接受带 meter/metre 后缀的全称及复数，例如 metre、centimeters、millimetres。
source_unit = m
deformation_scale = 1000
# Derived from the source unit and deformation_scale. Use m/cm/mm for those conversions.
# 按源单位和倍率填写 m、cm 或 mm；其他倍率使用 scaled_from_<源单位>_by_<倍率>。
output_unit = mm
# Accepted: cumulative_displacement.
# 此入口仅接受 cumulative_displacement（累计位移）。
deformation_quantity = cumulative_displacement
height_unit = m

# This workflow keeps the source sign and temporal reference. Scale above only changes units.
# 此入口仅接受 source_values_preserved_direction_unknown；保留来源正负号，上面的倍率仅转换单位。
los_positive = source_values_preserved_direction_unknown
# Within the positive mask, a finite deformation zero is valid even if the TIFF
# declares zero as nodata. Finite nonzero nodata sentinels are still excluded.
# 正掩膜内的有限零值视为有效，即使 TIFF 声明零为 nodata；非零 nodata 值仍排除。
nodata_policy = finite deformation and height plus positive static mask; zero is valid
# Accepted: preserve (keep the input temporal reference).
# 此入口仅接受 preserve，沿用源数据时间参考。
temporal_reference = preserve
# Describe the source reference and provenance recorded with the export.
# 填写来源的空间参考及来源记录。
spatial_reference = preserve upstream spatial reference
source_provenance = indexed single-band GeoTIFF time series

# Choose target_points, factor, or target_pixel_size. Set only the matching parameter.
# 可选 target_points、factor、target_pixel_size，并设置对应参数。
# target_pixel_size 使用源栅格单位（EPSG:4326 为度）。
downsample_mode = target_points
# Approximate point count; factor=1 disables downsampling in factor mode.
# 目标点数为近似值；factor 模式下设为 1 即不降采样。
target_points = 100000
# factor = 1
# target_pixel_size = 0.001
# Accepted: mean (default) or median, over valid samples in each window.
# 可选 mean（有效样本均值，默认）或 median（有效样本中位数）。
aggregation = mean
# 每次读取的行数上限；默认 128。
chunk_rows = 128

# Text columns: x y height displacement in the configured CRS and units.
# 文本四列为 x、y、高程、位移，采用上述坐标系与相应单位。
format = %.3f %.3f %.3f %.6f
# Optional downsampled/geocoded GeoTIFF output; default false.
# 是否同时写降采样后的 GeoTIFF，默认 false。
# Accepted: true/yes/1/on or false/no/0/off (case-insensitive).
# 可选 true/yes/1/on 或 false/no/0/off，不区分大小写。
write_tif = true
# true replaces a completed export after the new export succeeds; false retains it and reports an error. Default true.
# true 在新结果成功后替换旧导出目录，false 保留已有目录并报错；默认 true。
# Accepted: true/yes/1/on or false/no/0/off (case-insensitive).
# 可选 true/yes/1/on 或 false/no/0/off，不区分大小写。
overwrite = true
