# Read-only HDF5 inspection / HDF5 只读检查
# Run from the repository root / 在仓库根目录运行：
#   insar-adapter inspect --config config/canonical/inspect_h5.cfg

# Paths are resolved relative to this cfg file.
# 路径相对于本 cfg 文件解析。
input_file = /path/to/timeseries.h5

# auto, mintpy, licsbas, or standard
# 可选 auto、mintpy、licsbas 或 standard。
input_type = auto

# Reject a source whose deformation unit cannot be established.
# 无法确定形变单位时拒绝通过校验。
require_unit = true
