# Command / 命令：insar-adapter convert-licsbas --config config/data2canonical/licsbas2canonical_h5.cfg
# LiCSBAS -> canonical grid HDF5 / LiCSBAS -> 标准规则栅格 HDF5
#
# Relative paths are resolved from this cfg. The source is always opened read-only.
# 相对路径以本 cfg 所在目录解析；来源文件始终只读打开。
# PATH CONTRACT / 路径契约
# OUTPUT / 输出：显式 output_file 优先；省略时可由 method-root 上下文自动写入
# <processing_root>/CANONICAL/<output_name>。成功原子覆盖，失败保留旧文件。

# LiCSBAS HDF5 with cumulative deformation, dates, DEM, mask, and grid scalars.
# 包含累计形变、日期、DEM、mask 及网格标量的 LiCSBAS HDF5。
input_file = ../../data/TS_GEOCml1clip/cum.h5
output_file = ../../result/licsbas_canonical.h5
# project_root = /path/to/research-project
# project = S1/ASCENDING_128
# processing_root = S1/ASCENDING_128/LiCSBAS
# output_name = licsbas_timeseries.h5

# Standard LiCSBAS dataset names; change only for a documented variant.
# 标准 LiCSBAS 数据集名称；仅在有明确记录的变体中修改。
deformation_dataset = cum
date_dataset = imdates
height_dataset = hgt
mask_dataset = mask

# Required because many LiCSBAS HDF5 files do not store these as attributes.
# 这些参数必填，因为许多 LiCSBAS HDF5 并未将其写入属性。
deformation_unit = mm
height_unit = m
crs = EPSG:4326
los_positive = toward_satellite
# date: subtract this epoch from every epoch; preserve: copy cum unchanged and
# require source_temporal_reference instead.
# date：每一期减去指定时期；preserve：原样复制 cum，并改填
# source_temporal_reference 说明来源时间参考。
temporal_reference = date
temporal_reference_date = 20150530
grid_registration = pixel
nodata_policy = finite mask values greater than zero are valid; NaN is nodata; zero displacement is valid

# Bounded-memory and HDF5 storage settings.
# 受控内存与 HDF5 存储参数。
chunk_rows = 256
compression = gzip
compression_level = 4
