# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：GAMMA → canonical HDF5
# RUN / 运行：在仓库根目录使用 envInSAR。
#   insar-adapter convert-gamma --config config/data2canonical/gamma2canonical_h5.cfg
# INPUTS / 输入：GAMMA 位移表、日期、规则经纬度网格参数、DEM、掩膜。
# OUTPUTS / 输出：output_file，或 <processing_root>/CANONICAL/<output_name>。
# RERUN / 重跑：成功校验后原子替换旧 HDF5；失败保留旧文件。

# GAMMA geocoded binary stack -> canonical HDF5
# GAMMA 地理编码二进制时序 -> 标准 HDF5
#
# This first GAMMA adapter accepts only a regular lon/lat grid described by
# width, nlines, corner_lon, corner_lat, post_lon, and post_lat in the par file.
# 首版 GAMMA adapter 仅接受 par 中包含上述参数的规则经纬度网格。

# One deformation path per line; relative entries resolve from the tab directory.
# 每行一个形变文件；tab 内相对路径以 tab 所在目录解析。
tab_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/TIMESERIES/GAMMA_MB/DISPLACEMENT_GEO/displacement_geo_tab
dates_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/TIMESERIES/GAMMA_MB/images
parameter_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/GEOCODING/demcrop.dem_par
height_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/GEOCODING/demcrop.dem
mask_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/TIMESERIES/GAMMA_MB/final_mask.geo
output_file = /path/to/project/S1/ASCENDING_128/GAMMA_mb/CANONICAL/gamma_timeseries.h5
# project_root = /path/to/research-project
# project = S1/ASCENDING_128
# processing_root = S1/ASCENDING_128/GAMMA_mb
# output_name = gamma_timeseries.h5

# Every headerless binary representation is explicit. One-byte masks still
# declare byte order so the cfg contract remains uniform.
# 所有无文件头二进制表示均显式声明；单字节 mask 也保留字节序字段。
# Use a fixed-width real NumPy dtype matching each file.
# 常用可选 float16/float32/float64、int8/int16/int32/int64、
# uint8/uint16/uint32/uint64，也接受等价 NumPy 写法（如 f4 和 u1）。
deformation_dtype = float32
# Accepted: big (big-endian), little (little-endian), native (host-endian).
# 可选 big（大端）、little（小端）、native（运行机器字节序）；按对应文件实际格式填写。
deformation_byte_order = big
height_dtype = float32
# Accepted: big (big-endian), little (little-endian), native (host-endian).
# 可选 big（大端）、little（小端）、native（运行机器字节序）；按对应文件实际格式填写。
height_byte_order = big
mask_dtype = float32
# Accepted: big (big-endian), little (little-endian), native (host-endian).
# 可选 big（大端）、little（小端）、native（运行机器字节序）；按对应文件实际格式填写。
mask_byte_order = big

# Required units, coordinate system, LOS sign, and grid registration.
# 填写输入单位、坐标系、LOS 正方向和栅格配准方式。
deformation_unit = m
height_unit = m
# Accepted: EPSG:4326 or 4326, for a regular WGS84 lon/lat grid.
# 此入口仅接受 EPSG:4326 或 4326，为 WGS84 规则经纬度网格。
crs = EPSG:4326
# LOS sign is recorded as metadata. Use the source convention, e.g. toward_satellite or away_from_satellite.
# LOS 正方向写入元数据。按来源填写，例如 toward_satellite（朝卫星）或 away_from_satellite（远离卫星）。
los_positive = toward_satellite
# Accepted: pixel.
# 此转换仅接受 pixel（像元中心坐标）。
grid_registration = pixel
# Optional upstream reference pixel or region. Omit to record unknown.
# 已知上游参考像元或区域时填写；省略时记录 unknown。此项只写入元数据。
# spatial_reference = row=120,column=230,zero_based

# The adapter generates nodata_policy from the explicit mask and configured sentinels.
# 程序根据掩膜和下方哨兵值自动生成 nodata_policy。掩膜有限且大于 0 时有效。
# Omit these values if the source uses no finite sentinels.
# 只有源数据使用有限数值表示无效值时才填写；所填值会转换为 NaN。
# deformation_nodata = -9999
# height_nodata = -9999

# preserve: copy source values and describe their existing temporal reference.
# date: subtract temporal_reference_date from every epoch by row block.
# preserve：原样复制并说明已有时间参考；date：按行块减去指定时期。
temporal_reference = preserve
# In preserve mode, record the source epoch or a short descriptive identifier.
# preserve 模式填写源参考日期或简短的来源标识，例如 gamma_native_solution。
source_temporal_reference = gamma_native_solution
# With temporal_reference = date, set this to an actual epoch in dates_file.
# 使用 date 模式时，填写 dates_file 中实际存在的参考日期。
# temporal_reference_date = YYYYMMDD

# Bounded-memory HDF5 storage settings / 受控内存 HDF5 存储参数。
chunk_rows = 128
# Accepted: gzip (default), lzf, none. Only gzip uses compression_level.
# 可选 gzip（默认）、lzf、none。只有 gzip 使用 compression_level（0–9）。
compression = gzip
compression_level = 4
