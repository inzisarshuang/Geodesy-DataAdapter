# Command / 命令：insar-adapter convert-mintpy --config config/data2canonical/mintpy2canonical_h5.cfg
# MintPy -> canonical grid HDF5 / MintPy -> 标准规则栅格 HDF5
#
# All relative paths are resolved from this cfg file. Inputs are opened read-only.
# 所有相对路径均以本 cfg 所在目录解析；输入始终只读打开。
# PATH CONTRACT / 路径契约
# OUTPUT / 输出：显式 output_file 优先；省略时可由 method-root 上下文自动写入
# <processing_root>/CANONICAL/<output_name>。成功原子覆盖，失败保留旧文件。

# MintPy cumulative time series containing /timeseries and /date.
# 包含 /timeseries 和 /date 的 MintPy 累积形变时序。
timeseries_file = ../../data/timeseries.h5

# Explicit DEM HDF5 and dataset. A DEM is mandatory and is never replaced by zeros.
# 显式 DEM HDF5 及数据集；DEM 必填，程序绝不会用零高程代替。
geometry_file = ../../data/geometryGeo.h5
height_dataset = height

# Explicit static validity mask; non-zero cells are valid.
# 显式静态有效掩膜；非零像元代表有效。
mask_file = ../../data/maskTempCoh.h5
mask_dataset = mask

# Atomic output replaces the destination after successful validation.
# 原子输出在校验成功后直接替换目标文件。
output_file = ../../result/timeseries_canonical.h5
# project_root = /path/to/research-project
# project = S1/ASCENDING_128
# processing_root = S1/ASCENDING_128/MintPy
# output_name = mintpy_timeseries.h5

# Required scientific conventions. These values are recorded, not inferred.
# 必填科学约定；仅记录这些值，不进行推断。
los_positive = toward_satellite
nodata_policy = external mask defines validity; NaN is nodata; source zero is preserved
height_unit = m

# Bounded-memory and HDF5 storage settings.
# 受控内存与 HDF5 存储参数。
chunk_rows = 256
compression = gzip
compression_level = 4
