# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：HDF5 inspection / HDF5 只读检查
# RUN / 运行：在仓库根目录使用 envInSAR。
#   insar-adapter inspect --config config/data2canonical/inspect_h5.cfg
#   insar-adapter validate --config config/data2canonical/inspect_h5.cfg
# INPUTS / 输入：明确的 HDF5 文件与期望来源类型。
# OUTPUTS / 输出：inspect 打印 JSON 摘要；validate 打印校验结果。
# RERUN / 重跑：每次都读源文件；两种命令均不写入产品。

# Paths are resolved relative to this cfg file.
# 路径相对于本 cfg 文件解析。
input_file = /path/to/timeseries.h5

# Accepted: auto (default), mintpy, licsbas, standard.
# 可选 auto（自动识别，默认）、mintpy、licsbas、standard（canonical HDF5）。
input_type = auto

# Reject a source whose deformation unit cannot be established. Default true.
# true（默认）要求能确定形变单位，false 允许检查缺少单位的来源。
# Accepted: true/yes/1/on or false/no/0/off (case-insensitive).
# 可选 true/yes/1/on 或 false/no/0/off，不区分大小写。
require_unit = true
