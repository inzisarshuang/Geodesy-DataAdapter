# GAMMA geocoded binary stack -> canonical HDF5
# GAMMA 地理编码二进制时序 -> 标准 HDF5
#
# This first GAMMA adapter accepts only a regular lon/lat grid described by
# width, nlines, corner_lon, corner_lat, post_lon, and post_lat in the par file.
# 首版 GAMMA adapter 仅接受 par 中包含上述参数的规则经纬度网格。
# PATH CONTRACT / 路径契约
# INPUTS / 输入：只读读取上游 GAMMA 产品。
# OUTPUT / 输出：显式 output_file 优先；省略时可由 project_root、project、
# processing_root 和 output_name 自动生成 <processing_root>/CANONICAL/<output_name>。
# REUSE / 重跑：Adapter 生成快，成功校验后原子覆盖旧输出；失败保留旧文件。

# One deformation path per line; relative entries resolve from the tab directory.
# 每行一个形变文件；tab 内相对路径以 tab 所在目录解析。
tab_file = ../data/TPF_DISP_tab_geo
dates_file = ../data/images
parameter_file = ../data/20250625.dem.cropped.par
height_file = ../data/20250625.utm.dem
mask_file = ../data/final.mask.zero_filtered.geo
output_file = ../result/gamma_canonical.h5
# project_root = /path/to/research-project
# project = S1/ASCENDING_128
# processing_root = S1/ASCENDING_128/GAMMA
# output_name = gamma_timeseries.h5

# Every headerless binary representation is explicit. One-byte masks still
# declare byte order so the cfg contract remains uniform.
# 所有无文件头二进制表示均显式声明；单字节 mask 也保留字节序字段。
deformation_dtype = float32
deformation_byte_order = big
height_dtype = float32
height_byte_order = big
mask_dtype = float32
mask_byte_order = big

# Required scientific conventions; no unit, sign, CRS, or reference is inferred.
# 必填科学约定；不推断单位、正负号、CRS 或参考。
deformation_unit = m
height_unit = m
crs = EPSG:4326
los_positive = toward_satellite
grid_registration = pixel
spatial_reference = upstream GAMMA spatial reference; see processing manifest
nodata_policy = source zero displacement is valid only where the explicit mask is valid

# Optional finite sentinels are converted to NaN and recorded in metadata.
# 可选有限哨兵值会转换为 NaN，并记录到元数据。
# deformation_nodata = -9999
# height_nodata = -9999

# preserve: copy source values and describe their existing temporal reference.
# date: subtract temporal_reference_date from every epoch by row block.
# preserve：原样复制并说明已有时间参考；date：按行块减去指定时期。
temporal_reference = date
temporal_reference_date = 20240102
# temporal_reference = preserve
# source_temporal_reference = gamma_native_solution

# Bounded-memory HDF5 storage settings / 受控内存 HDF5 存储参数。
chunk_rows = 128
compression = gzip
compression_level = 4
